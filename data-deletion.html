  <h1>조대리 데이터 삭제 안내</h1>
  <p>조대리가 보관하는 내 요청 기록(인스타그램 식별자, 공유한 게시물, 요청 시각)을 삭제하려면 다음과 같이 요청해 주세요.</p>
  <ol>
    <li>인스타그램에서 조대리 계정 <b>@like.daeri</b>에게 DM을 엽니다.</li>
    <li><b>"내 정보 삭제"</b>라고 보냅니다.</li>
    <li>요청 기록이 즉시 삭제되고, 삭제 완료 답장을 받습니다.</li>
  </ol>
  <p>삭제 후에도 개인을 식별할 수 없는 합계 통계(예: 게시물별 요청 수)는 남을 수 있습니다.</p>
